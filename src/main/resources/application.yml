spring:
  application:
    name: flashdeal
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/flashdeal?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:flashdeal}
    password: ${DB_PASSWORD:flashdeal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:flashdeal}
    password: ${RABBITMQ_PASSWORD:flashdeal}
    publisher-confirm-type: correlated
    publisher-returns: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true

flashdeal:
  worker-id: ${WORKER_ID:-1}   # -1 (default) => auto-derive from hostname for horizontal scaling
  token-ttl: ${TOKEN_TTL:PT10S}
