services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: flashdeal
      MYSQL_USER: flashdeal
      MYSQL_PASSWORD: flashdeal
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["mysql-data:/var/lib/mysql"]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: flashdeal
      RABBITMQ_DEFAULT_PASS: flashdeal
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/flashdeal?serverTimezone=UTC
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    ports: ["8080:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
volumes:
  mysql-data:
