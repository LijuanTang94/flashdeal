events {}

http {
    # Docker's embedded DNS. Using a variable in proxy_pass forces per-request
    # re-resolution, so the 'app' service name round-robins across scaled replicas.
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        location / {
            set $backend app;
            proxy_pass http://$backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
