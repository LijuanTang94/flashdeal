# Load balancer in front of the scaled app replicas.
#
# Tuning notes (these matter for load testing -- nginx defaults to 1 worker
# process and 512 connections, and every proxied request consumes TWO
# connections, so an untuned nginx saturates around ~256 concurrent requests
# and you end up measuring nginx rather than the application).
worker_processes auto;

events {
    worker_connections 8192;
}

http {
    access_log off;

    upstream app_pool {
        # Docker's embedded DNS returns one A record per replica. nginx expands
        # a multi-address hostname into multiple upstream servers at startup,
        # so this round-robins across `--scale app=N`.
        # (Resolved once at boot -- fine for a load test, where the replica set
        # is fixed before traffic starts. Start nginx after the app replicas.)
        server app:8080;

        # Reuse upstream connections instead of opening a fresh TCP connection
        # plus handshake for every proxied request.
        keepalive 256;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app_pool;

            # Required for upstream keepalive to actually take effect.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
